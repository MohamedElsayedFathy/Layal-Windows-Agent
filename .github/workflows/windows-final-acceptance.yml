name: Layal PowerShell final acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/REQUIREMENT_TRACEABILITY.csv'
      - 'docs/AYO_FEATURE_PARITY_AR.md'
      - '.github/workflows/windows-final-acceptance.yml'

permissions:
  contents: read

jobs:
  final-acceptance:
    name: Full Windows acceptance
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.402

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Run the PowerShell final acceptance orchestrator
        shell: pwsh
        run: |
          & .\tools\Invoke-LayalFinalAcceptance.ps1 -RunDesktopIntegration -RunInstallerLifecycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload final acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Layal-${{ github.sha }}-final-acceptance
          path: |
            artifacts/final-acceptance/**
            artifacts/final-acceptance-test-results/**
            artifacts/distribution/**
            artifacts/security/**
          if-no-files-found: warn
          retention-days: 30
