name: Layal Windows build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Static source checks
        run: python tools/validate_project.py

      - name: Parse interactive click-through acceptance harness
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($relativePath in @('tools/Test-LayalClickThrough.ps1', 'tools/Test-LayalClickThrough.Native.ps1', 'tools/Test-LayalDisplayDpi.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $relativePath), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error ($relativePath + ': ' + $_.Message) }
              exit 1
            }
          }

      - name: Source hygiene checks
        run: python tools/validate_release.py

      - name: Package source and validate ZIP
        run: python tools/package_source.py --output artifacts/Layal-Windows-Agent-0.5.2-source.zip

      - name: Restore
        run: dotnet restore Layal.sln --nologo

      - name: Release build
        run: dotnet build Layal.sln --configuration Release --no-restore --nologo

      - name: Run native Windows desktop click-through integration
        shell: pwsh
        run: |
          & .\\tools\\Test-LayalClickThrough.Native.ps1 -LayalExePath ".\\src\\Layal.Desktop\\bin\\Release\\net10.0-windows\\Layal.exe" -LogDirectory "artifacts/interactive-acceptance/click-through" -ClickThroughOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native Windows desktop mouse-drag integration
        shell: pwsh
        run: |
          & .\\tools\\Test-LayalClickThrough.Native.ps1 -LayalExePath ".\\src\\Layal.Desktop\\bin\\Release\\net10.0-windows\\Layal.exe" -LogDirectory "artifacts/interactive-acceptance/drag" -DragOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
 
      - name: Run Windows display and DPI topology smoke test
        shell: pwsh
        run: |
          & .\\tools\\Test-LayalDisplayDpi.ps1 -LayalExePath ".\\src\\Layal.Desktop\\bin\\Release\\net10.0-windows\\Layal.exe" -ObserveSeconds 3 -LogDirectory "artifacts/display-dpi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $summaryPath = "artifacts/display-dpi/display-dpi-summary.json"
          if (-not (Test-Path -LiteralPath $summaryPath -PathType Leaf)) { throw "Display/DPI diagnostic did not write its JSON summary." }
          $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
          if ($summary.Result -ne "passed") { throw "Display/DPI smoke diagnostic did not pass its requested checks." }
          if ($summary.ManualVisualAcceptanceStatus -ne "pending") { throw "The diagnostic must not claim that manual visual acceptance was completed." }
          if ($summary.MonitorCount -lt 2 -and $summary.TopologyDpiGateStatus -ne "not-certified") { throw "A single-monitor smoke run must not certify the multi-monitor DPI gate." }
          if ($summary.TopologyDpiGateStatus -eq "passed" -and -not $summary.TopologyDpiTransitionsObserved) { throw "The topology/DPI gate is marked passed without recorded transitions." }
          Write-Host ("Topology/DPI gate: {0}; manual visual acceptance: {1}" -f $summary.TopologyDpiGateStatus, $summary.ManualVisualAcceptanceStatus)

      - name: Run automated tests
        run: dotnet test Layal.sln --configuration Release --no-build --no-restore --nologo --logger "trx;LogFileName=Layal.Tests.trx" --results-directory artifacts/test-results

      - name: Upload native desktop acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Layal-${{ github.sha }}-interactive-acceptance
          path: artifacts/interactive-acceptance/**/*
          if-no-files-found: warn
          retention-days: 14
 
      - name: Upload display and DPI topology evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Layal-${{ github.sha }}-display-dpi
          path: artifacts/display-dpi/**/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload WPF visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Layal-${{ github.sha }}-visual-smoke
          path: artifacts/visual-smoke/**/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify test reports contain executed tests
        if: success()
        run: python tools/validate_test_results.py artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Layal-${{ github.sha }}-test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload validated source package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Layal-${{ github.sha }}-source
          path: artifacts/Layal-Windows-Agent-0.5.2-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Layal-${{ github.sha }}-windows-release
          path: src/Layal.Desktop/bin/Release/net10.0-windows/
          if-no-files-found: error
          retention-days: 14
