name: Layal Windows build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate UI automation sample PowerShell syntax
        shell: powershell
        run: |
          $samplePath = (Resolve-Path "tools/Start-LayalUiAutomationSample.ps1").Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($samplePath, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object {
              Write-Host "Parse error at line $($_.Extent.StartLineNumber), column $($_.Extent.StartColumnNumber): $($_.Message)"
            }
            exit 1
          }
          Write-Host "PowerShell sample syntax: PASS"

      - name: Static source checks
        run: python tools/validate_project.py

      - name: Source hygiene checks
        run: python tools/validate_release.py

      - name: Package source and validate ZIP
        run: python tools/package_source.py --output artifacts/Layal-Windows-Agent-0.5.2-source.zip

      - name: Restore
        run: dotnet restore Layal.sln --nologo

      - name: Release build
        run: dotnet build Layal.sln --configuration Release --no-restore --nologo

      - name: Run automated tests
        run: dotnet test Layal.sln --configuration Release --no-build --no-restore --nologo --logger "trx;LogFileName=Layal.Tests.trx" --results-directory artifacts/test-results

      - name: Verify test reports contain executed tests
        if: success()
        run: python tools/validate_test_results.py artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Layal-${{ github.sha }}-test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload validated source package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Layal-${{ github.sha }}-source
          path: artifacts/Layal-Windows-Agent-0.5.2-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Layal-${{ github.sha }}-windows-release
          path: src/Layal.Desktop/bin/Release/net10.0-windows/
          if-no-files-found: error
          retention-days: 14
